<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <defs>
    <linearGradient id="studioWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F0ECE5" />
    </linearGradient>
    <linearGradient id="oakWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6D7C6" />
      <stop offset="50%" stop-color="#DECBB6" />
      <stop offset="100%" stop-color="#D3BEAA" />
    </linearGradient>
    <linearGradient id="vaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F6F3EE" />
      <stop offset="100%" stop-color="#E7E0D6" />
    </linearGradient>
    <filter id="elevation" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#292724" flood-opacity="0.06" />
    </filter>
    <filter id="rayBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <rect width="960" height="720" fill="url(#studioWall)" />

  <!-- Soft arched architectural niche -->
  <path d="M180,720 L180,290 A240,240 0 0,1 660,290 L660,720 Z" fill="#F5F1EB" stroke="#EAE6E1" stroke-width="1.5" />

  <!-- Diagonal sunlight from tall studio window -->
  <g filter="url(#rayBlur)" opacity="0.75">
    <polygon points="0,80 560,0 960,440 960,720 260,720" fill="#FFFFFF" opacity="0.65" />
  </g>

  <!-- Minimalist natural oak console table -->
  <g filter="url(#elevation)">
    <rect x="110" y="540" width="740" height="28" rx="6" fill="url(#oakWood)" />
    <rect x="180" y="568" width="34" height="152" fill="#D5C1AC" />
    <rect x="746" y="568" width="34" height="152" fill="#D5C1AC" />
  </g>

  <!-- Framed minimalist line relief on wall -->
  <g filter="url(#elevation)">
    <rect x="270" y="150" width="210" height="270" rx="4" fill="#FAF8F5" stroke="#DFD8CE" stroke-width="2" />
    <rect x="288" y="168" width="174" height="234" fill="#FFFFFF" />
    <circle cx="375" cy="265" r="46" fill="#F4EFE8" />
    <path d="M325,355 Q375,295 425,355" stroke="#D9CEC2" stroke-width="2" fill="none" />
  </g>

  <!-- Sculptural matte white ceramic vase -->
  <g filter="url(#elevation)">
    <path d="M555,540 C525,540 512,485 524,435 C534,395 552,375 556,345 L594,345 C598,375 616,395 626,435 C638,485 625,540 595,540 Z" fill="url(#vaseGrad)" stroke="#EAE6E1" stroke-width="1.2" />
    <!-- Dried branches & white blossoms -->
    <path d="M575,345 Q560,260 520,195" stroke="#8C847B" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M578,345 Q595,250 645,180" stroke="#8C847B" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M572,345 Q575,275 580,215" stroke="#8C847B" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <circle cx="518" cy="192" r="18" fill="#FFFFFF" stroke="#EAE6E1" stroke-width="1.2" />
    <circle cx="546" cy="235" r="15" fill="#FAF8F5" stroke="#EAE6E1" stroke-width="1.2" />
    <circle cx="646" cy="178" r="19" fill="#FFFFFF" stroke="#EAE6E1" stroke-width="1.2" />
    <circle cx="614" cy="228" r="14" fill="#FFFFFF" stroke="#EAE6E1" stroke-width="1.2" />
    <circle cx="580" cy="210" r="16" fill="#FAF8F5" stroke="#EAE6E1" stroke-width="1.2" />
  </g>

  <!-- Travertine tray with rolled cotton towels & aroma diffuser -->
  <g filter="url(#elevation)">
    <rect x="240" y="516" width="220" height="24" rx="5" fill="#EFEAE2" stroke="#E2DBD1" stroke-width="1" />
    <ellipse cx="295" cy="502" rx="34" ry="16" fill="#FFFFFF" stroke="#EAE6E1" stroke-width="1.2" />
    <ellipse cx="355" cy="504" rx="32" ry="14" fill="#FAF8F5" stroke="#EAE6E1" stroke-width="1.2" />
    <rect x="405" y="472" width="32" height="44" rx="8" fill="#E9DED4" />
  </g>
</svg>
