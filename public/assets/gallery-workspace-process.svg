<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <defs>
    <linearGradient id="procBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#EFE8DF" />
    </linearGradient>
    <filter id="procShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#292724" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="960" height="720" fill="url(#procBg)" />

  <!-- Clean white manicure workspace mat -->
  <rect x="110" y="95" width="740" height="530" rx="16" fill="#FFFFFF" stroke="#EAE6E1" stroke-width="1.5" filter="url(#procShadow)" />

  <!-- Minimalist palette of milky & nude gel polishes on stone palette -->
  <g filter="url(#procShadow)">
    <path d="M210,260 C190,190 290,150 385,165 C485,180 530,255 505,345 C480,435 375,470 285,445 C205,422 225,320 210,260 Z" fill="#FAF8F5" stroke="#E5DDD3" stroke-width="1.5" />
    <!-- 4 curated swatches of milky, porcelain, oat, and soft blush -->
    <ellipse cx="305" cy="240" rx="38" ry="24" transform="rotate(-15 305 240)" fill="#FFFFFF" stroke="#EAE6E1" stroke-width="1" />
    <ellipse cx="395" cy="255" rx="38" ry="24" transform="rotate(-15 395 255)" fill="#FAF3EC" stroke="#E9DED4" stroke-width="1" />
    <ellipse cx="325" cy="335" rx="38" ry="24" transform="rotate(-15 325 335)" fill="#F2E6DA" stroke="#E5D6C7" stroke-width="1" />
    <ellipse cx="415" cy="350" rx="38" ry="24" transform="rotate(-15 415 350)" fill="#E9DED4" stroke="#DBCBC0" stroke-width="1" />
  </g>

  <!-- Sealed sterile craft pouch & fine detail brushes on right -->
  <g filter="url(#procShadow)">
    <rect x="575" y="165" width="205" height="390" rx="8" fill="#F4ECE1" stroke="#E2D5C6" stroke-width="1.2" />
    <rect x="595" y="185" width="165" height="30" rx="3" fill="#FFFFFF" opacity="0.7" />
    <line x1="610" y1="200" x2="710" y2="200" stroke="#827D76" stroke-width="1.5" />
    <!-- Fine manicure brush resting beside -->
    <rect x="530" y="195" width="10" height="330" rx="5" fill="#292724" />
    <rect x="531" y="168" width="8" height="28" rx="2" fill="#D8C9B8" />
    <path d="M532,168 L535,148 L538,168 Z" fill="#827D76" />
  </g>
</svg>
